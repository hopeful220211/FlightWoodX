# FlightWoodX nginx 主配置（RFC-024 §4.8）。托管前端静态页 + 反代 /api → api:3000 + HTTPS。
# server 块在 templates/default.conf.template（含 ${FWX_*} 变量，容器启动时 envsubst 生成到
# conf.d/default.conf，正好覆盖 nginx 镜像自带的 default.conf）。
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # 大文件走 OSS，这里只服务前端小文件 + 反代 JSON；开 gzip 省 3Mbps 带宽
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;

  # 上游 API（compose 内网服务名）
  upstream fwx_api { server api:3000; }

  include /etc/nginx/conf.d/*.conf;
}
