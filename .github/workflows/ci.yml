name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - platform-2.0
      - "preview/**"
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository harness
            command: pnpm harness
          - name: Typecheck and API syntax
            command: pnpm typecheck && pnpm check:api
          - name: Tests
            command: pnpm test
          - name: Lint
            command: pnpm lint
          - name: Security checks
            command: pnpm security
          - name: Production build
            command: pnpm build

    steps:
      - name: Check out repository
        uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          CI: true
